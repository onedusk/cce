[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cce"
version = "0.3.0"
description = "Evidence-first content curation engine with enforced citations"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "firecrawl-py>=1.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "sqlite-vec>=0.1.7",
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "pynacl>=1.6.2",
    "typer>=0.24.1",
]

[project.scripts]
cce = "cce.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pyright>=1.1.380",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cce"]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter; LLM prompts are intentionally long

[tool.ruff.lint.isort]
known-first-party = ["cce"]

[tool.coverage.run]
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage floor recalibrated for *branch* coverage on 2026-06-09 per ADR-004
# (audit-2026-06-09), step 2 of 2. Branch coverage is a stricter metric than
# the statement coverage measured before: it also requires each conditional's
# True/False arms to be exercised. Step 1 (M02) flipped branch coverage on
# with a transitional floor of 89 (91.58% observed). Step 2 (M04) landed the
# operational-shell tests — remote mode via ASGITransport, crash->FAILED,
# the real lifespan shutdown handler, the real embedded() factory, and CLI
# batch/emit-mdx/key-revoke — raising observed branch coverage to 94.26%
# (2026-06-09), so the final floor is floor(observed) - 2 = 92. Per-module:
# engine.py is at 95% branch, meeting the >= 85% PRD success criterion.
# Replaces the old statement floor of 90 (ADR-007, audit-2026-04-14).
addopts = "--cov=src/cce --cov-report=term-missing:skip-covered --cov-fail-under=92"
markers = [
    "unit: Fast tests with no I/O or external dependencies",
    "integration: Tests using real I/O (SQLite, filesystem) with mocked external services",
    "slow: Tests that take >1s (multi-iteration pipeline loops)",
    "e2e: End-to-end tests requiring real ANTHROPIC_API_KEY and FIRECRAWL_API_KEY",
]
