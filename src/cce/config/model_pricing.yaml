# Model prices for job cost estimates (B15), in USD per million tokens.
#
# Anthropic first-party API list prices, checked 2026-10-02. Bedrock and
# Vertex AI are priced separately by those platforms. cache_write is the
# 5-minute cache write rate (1.25x input), the only TTL cce requests.
#
# To change or add prices without editing the package, put the same shape in
# config/model_pricing.yaml in the working directory: its entries override
# these. A model ID matches its own entry or the entry with a trailing
# -YYYYMMDD snapshot date removed. A job that used a model with no entry
# reports no cost estimate, never a partial one.
models:
  claude-fable-5-1: {input: 10.00, output: 50.00, cache_write: 12.50, cache_read: 0.25}
  claude-mythos-5-1: {input: 10.00, output: 50.00, cache_write: 12.50, cache_read: 0.25}
  claude-fable-5: {input: 10.00, output: 50.00, cache_write: 12.50, cache_read: 1.00}
  claude-mythos-5: {input: 10.00, output: 50.00, cache_write: 12.50, cache_read: 1.00}
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
  claude-opus-5: {input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50}
  claude-opus-4-8: {input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50}
  claude-opus-4-7: {input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50}
  claude-opus-4-6: {input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
  claude-sonnet-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
  claude-sonnet-4-6: {input: 3.00, output: 15.00, cache_write: 3.75, cache_read: 0.30}
  claude-haiku-4-5: {input: 1.00, output: 5.00, cache_write: 1.25, cache_read: 0.10}
