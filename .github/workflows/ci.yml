name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest --tb=short -q

      # Regenerate docs/openapi.json from the app and fail if the committed
      # copy is stale (audit-2026-06-09 finding 4.8). engine_version is pinned
      # to the pyproject version so the exported schema tracks releases.
      - name: OpenAPI freshness
        run: |
          uv run python - <<'EOF' > docs/openapi.json
          import json
          import tomllib

          from cce.api.app import create_app
          from cce.config.loader import load_config

          config = load_config()
          with open("pyproject.toml", "rb") as f:
              config.engine_version = tomllib.load(f)["project"]["version"]
          print(json.dumps(create_app(config).openapi(), indent=2))
          EOF
          git diff --exit-code docs/openapi.json

      # The wheel must carry the data files the engine loads at start-up: a
      # consumer installing cce as a dependency has no config/ directory
      # (audit 3.1: the humanization markers were missing from the wheel).
      - name: Wheel carries packaged data
        run: |
          uv build --wheel -o dist-check
          unzip -l dist-check/*.whl | grep "cce/config/humanization_markers.yaml"
          unzip -l dist-check/*.whl | grep "cce/config/model_pricing.yaml"

      # Install that wheel with no lockfile, as a consumer does, so it gets
      # the newest dependencies the version bounds allow, and check it boots
      # and that its LLM requests bind to that SDK (audit OPS-01). No network
      # calls, no keys. This step goes red when an upstream release breaks
      # cce: that is its job.
      - name: Wheel works without the lockfile
        env:
          CCE_EMBEDDING_ENABLED: "false"
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/wheel-venv" uv pip install dist-check/*.whl
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/wheel-venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed_wheel.py"
